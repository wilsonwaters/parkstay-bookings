name: WA Stay CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      # better-sqlite3 ships one prebuilt Node-API binary, loaded by Jest (Node) and the app
      # (Electron) alike: nothing to rebuild after npm ci.
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      # SQLite's own timestamps are UTC with no zone: read them with the host in Perth (UTC+8).
      # TZ is set before Jest starts, since a running test cannot change its zone.
      - name: Run timestamp tests in Perth time
        run: npm run test:tz

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'wa-stay'
          path: '.'
          format: 'HTML'
        continue-on-error: true

      - name: Upload dependency check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 7

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          # Public (pk.) token for Explore's map, bundled into the renderer. Without it the
          # build still succeeds and Explore is list-only.
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || vars.MAPBOX_ACCESS_TOKEN }}

      - name: Check build artifacts
        run: |
          if [ ! -d "dist/main" ] || [ ! -d "dist/renderer" ]; then
            echo "Build artifacts are missing!"
            exit 1
          fi
          echo "Build artifacts verified successfully"

  e2e:
    name: Electron smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Since Electron 42, npm ci no longer downloads the Electron binary; Playwright's launcher
      # would fetch it during the first test. Fetch it here instead.
      - name: Download the Electron binary
        run: npx install-electron

      - name: Install xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Build the app without a Mapbox token
        run: npm run build:e2e

      - name: Run the Electron smoke tests
        run: xvfb-run -a npm run test:e2e

      # Always: a test that failed and then passed on its retry (flaky) keeps its first attempt's
      # trace and main-process log in test-results/, and the report lists both attempts.
      - name: Upload the Playwright report and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  packaged-smoke:
    name: Packaged app smoke (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          # The newest 24.x patch on every runner (the macOS image's cached 24.20 crashed Jest workers)
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Build the app without a Mapbox token
        run: npm run build:e2e

      - name: Package it for Linux, unpacked and not published
        run: npx electron-builder --linux dir --publish never

      # Reads the packaged binary's Electron fuses, then starts release/linux-unpacked/wa-stay
      # (and a copy named electron) with a temp data folder, waits for the window, quits within
      # 10 s with exit code 0, and checks that the test-only hooks are ignored
      # (scripts/packaged-smoke.js).
      - name: Start and quit the packaged app
        run: xvfb-run -a npm run smoke:packaged
